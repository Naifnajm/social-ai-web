# /etc/nginx/sites-available/social.stravica.nl  (certbot --nginx adds the 443 block and the redirect)
upstream stravica_social_web { server 127.0.0.1:3110; keepalive 16; }
upstream stravica_social_api { server 127.0.0.1:8110; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name social.stravica.nl;

    client_max_body_size 250m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API, media, short links, OAuth callbacks and webhooks
    location ~ ^/(api|m|r|oauth|webhooks|billing/webhooks)/ {
        proxy_request_buffering off;
        proxy_pass http://stravica_social_api;
    }
    location / {
        proxy_pass http://stravica_social_web;
    }
}
